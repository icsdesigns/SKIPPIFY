name: Weekly League Publish

on:
  schedule:
    # Cada hora domingo y lunes: GitHub retrasa y salta muchas ejecuciones. El
    # script publica una sola vez por grupo el corte del domingo 15:00 (Madrid).
    - cron: '0 * * * 0,1'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Publicar ahora (ignorar ventana domingo 15:00 Europe/Madrid)'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish weekly leaderboard
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FORCE_WEEKLY_PUBLISH: ${{ inputs.force_publish }}
        run: npm run publish:weekly
