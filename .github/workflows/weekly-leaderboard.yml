name: Weekly League Publish

on:
  schedule:
    # Dos veces por hora domingo y lunes, lejos del minuto 0: GitHub retrasa y
    # salta muchas ejecuciones, sobre todo las de en punto (el 27-09-2026 no
    # corrió ninguna entre las 17:00 y las 22:00 UTC). El script publica una
    # sola vez por grupo el corte del domingo 15:00 (Madrid).
    - cron: '17,47 * * * 0,1'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Publicar ahora (ignorar ventana domingo 15:00 Europe/Madrid)'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish weekly leaderboard
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FORCE_WEEKLY_PUBLISH: ${{ inputs.force_publish }}
        run: npm run publish:weekly
