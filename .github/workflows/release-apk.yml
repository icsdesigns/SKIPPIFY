name: Release APK

# Cada push a main compila la APK firmada y la publica como release. Es lo que
# alimenta el canal de actualización: la app consulta la última release al
# arrancar, se descarga la APK sola y sólo pide confirmación para instalarla.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/weekly-leaderboard.yml'
  workflow_dispatch:

# Un push mientras otro compila cancela el anterior: sólo interesa la última.
concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build:
    # windows-latest a propósito: build-apk.ps1 es el mismo script probado en
    # local, con todo el parcheado del manifiesto y los servicios nativos.
    # Portarlo a bash duplicaría esa lógica delicada por dos sitios.
    runs-on: windows-latest

    permissions:
      contents: write   # necesario para crear la release

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # El versionCode es el número de commits: hace falta la historia
          # entera, no el clon superficial que hace checkout por defecto.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Este paso comprueba los cuatro secrets ANTES de compilar, y dice cuál
      # falla. Un fallo aquí costaba antes una compilación entera de cinco
      # minutos para acabar en un error mudo.
      #
      # Nada de lo que imprime es secreto: sólo longitudes y el resultado de
      # cada comprobación. Aun así Actions enmascara automáticamente cualquier
      # valor que coincida con un secret.
      - name: Restaurar y comprobar el keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.SKIPPIFY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SKIPPIFY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SKIPPIFY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SKIPPIFY_KEY_PASSWORD }}
        run: |
          # Los mensajes salen como anotaciones (::notice:: / ::error::) además
          # de por consola: las anotaciones se pueden consultar por la API en un
          # repo público, mientras que los logs exigen autenticación. Así el
          # diagnóstico es legible desde fuera sin dar acceso a nadie.
          function Aviso ($texto) { Write-Host "::notice::$texto" }
          function Abortar ($texto) {
            Write-Host "::error::$texto"
            exit 1
          }

          $problemas = @()
          foreach ($nombre in 'KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD') {
            $valor = [Environment]::GetEnvironmentVariable($nombre)
            if ([string]::IsNullOrWhiteSpace($valor)) {
              $problemas += "SKIPPIFY_$nombre VACIO"
            } else {
              Aviso "SKIPPIFY_${nombre}: presente, $($valor.Length) caracteres"
            }
          }
          if ($problemas.Count) {
            $detalle = $problemas -join '; '
            Abortar "Secrets no visibles para el workflow ($detalle). Revisa que estén en Settings > Secrets and variables > Actions, pestaña 'Secrets' (no 'Variables'), como Repository secrets."
          }

          # Los saltos de línea que mete un copiar/pegar no rompen la decodificación,
          # pero un recorte a medias sí: por eso se comprueba el tamaño resultante.
          $limpio = $env:KEYSTORE_BASE64 -replace '\s', ''
          try {
            $bytes = [Convert]::FromBase64String($limpio)
          } catch {
            Abortar "SKIPPIFY_KEYSTORE_BASE64 no es base64 valido. Vuelve a copiarlo entero con: Get-Content android-keystore.base64.txt -Raw | Set-Clipboard"
          }
          Aviso "Keystore decodificado: $($bytes.Length) bytes"
          if ($bytes.Length -lt 1000) {
            Abortar "El keystore decodificado ocupa solo $($bytes.Length) bytes: el secret esta truncado."
          }

          $path = Join-Path $env:RUNNER_TEMP 'skippify-release.jks'
          [System.IO.File]::WriteAllBytes($path, $bytes)

          # keytool falla si la contraseña o el alias no son los del keystore, que
          # es justo el error que de otro modo aparecería enterrado en Gradle.
          #
          # $ErrorActionPreference vale 'stop' en los runners y PowerShell 7.4
          # convierte por su cuenta el código de salida de un ejecutable en
          # excepción, así que la llamada se envuelve para poder dar un mensaje
          # propio en vez de un volcado de PowerShell.
          $salida = ''
          try {
            $salida = (& keytool -list -keystore $path -storepass $env:KEYSTORE_PASSWORD -alias $env:KEY_ALIAS 2>&1 | Out-String)
          } catch {
            $salida = "$_"
          }
          if ($LASTEXITCODE -ne 0) {
            # Se recorta y se limpia de saltos: una anotación es de una línea.
            $motivo = ($salida -replace '\s+', ' ').Trim()
            if ($motivo.Length -gt 300) { $motivo = $motivo.Substring(0, 300) }
            Abortar "keytool no pudo abrir el keystore (codigo $LASTEXITCODE). Revisa SKIPPIFY_KEYSTORE_PASSWORD y SKIPPIFY_KEY_ALIAS contra android-keystore.properties. Detalle: $motivo"
          }

          Aviso "Keystore verificado correctamente."
          "SKIPPIFY_KEYSTORE_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compilar APK firmada
        shell: pwsh
        env:
          SKIPPIFY_KEYSTORE_PASSWORD: ${{ secrets.SKIPPIFY_KEYSTORE_PASSWORD }}
          SKIPPIFY_KEY_ALIAS: ${{ secrets.SKIPPIFY_KEY_ALIAS }}
          SKIPPIFY_KEY_PASSWORD: ${{ secrets.SKIPPIFY_KEY_PASSWORD }}
        run: .\scripts\build-apk.ps1

      - name: Leer datos de la build
        id: meta
        shell: pwsh
        run: |
          $manifest = Get-Content dist/latest.json -Raw | ConvertFrom-Json
          "versionCode=$($manifest.versionCode)" | Out-File $env:GITHUB_OUTPUT -Append
          "versionName=$($manifest.versionName)" | Out-File $env:GITHUB_OUTPUT -Append
          "apk=$($manifest.apk)"                 | Out-File $env:GITHUB_OUTPUT -Append
          "tag=v$($manifest.versionName)-b$($manifest.versionCode)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Skippify ${{ steps.meta.outputs.versionName }} (build ${{ steps.meta.outputs.versionCode }})
          # El cuerpo es lo que la app enseña como "novedades", así que se usa
          # el mensaje del commit tal cual.
          body: ${{ github.event.head_commit.message }}
          files: |
            dist/${{ steps.meta.outputs.apk }}
            dist/latest.json
